# Render Blueprint — generated by render-helper/make_render_repo.py.
# Render dashboard: New -> Blueprint -> pick this repo -> Apply.
#
#   https://one6102612-21-89ed.onrender.com   <- share this link / give it to the QA Agent
#   https://one6102612-21-api-89ed.onrender.com   backend
# If Render gives the backend a different URL (name taken), fix the rewrite
# destinations on the static site's Redirects/Rewrites page to match.

services:
  - type: web
    name: 16102612-21-api-89ed
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_PATH
        value: ./data/catalog.db

  - type: web
    name: 16102612-21-89ed
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://one6102612-21-api-89ed.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
